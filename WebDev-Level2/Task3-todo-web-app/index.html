
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="An interactive task manager to organize your daily tasks.">
    <title>Task Manager | To-Do App</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1>My Task Manager</h1>
            <p>Organize your day, one task at a time.</p>
        </div>
    </header>

    <main class="container">

        <!-- Add Task Section -->
        <section class="add-task-section">
            <input
                type="text"
                id="task-input"
                placeholder="What do you need to do?"
                aria-label="Enter a new task"
                maxlength="150"
            >

            <button id="add-task-btn" type="button">
                + Add Task
            </button>
        </section>

        <!-- Pending Tasks -->
        <section class="task-section">
            <div class="section-heading">
                <h2>Pending Tasks</h2>
                <span id="pending-count">0 pending</span>
            </div>

            <div id="pending-list" class="task-list"></div>
        </section>

        <!-- Completed Tasks -->
        <section class="task-section">
            <div class="section-heading">
                <h2>Completed Tasks</h2>
                <span id="completed-count">0 completed</span>
            </div>

            <div id="completed-list" class="task-list"></div>
        </section>

    </main>

    <footer class="footer">
        <p>&copy; <span id="current-year"></span> My Task Manager</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
